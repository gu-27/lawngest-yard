<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeration Bookings — Lawngest Yard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --green:#2d5a1b; --green-lt:#3d7a25; --green-xs:#edf5e8;
      --navy:#1a2535; --gold:#c9982a; --cream:#f7f9f5;
      --muted:#5a6a5a; --border:#dde8d5; --white:#ffffff;
    }
    body { font-family:'Inter',sans-serif; background:var(--cream); color:var(--navy); min-height:100vh; }
    .gate { position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .gate-box { background:white; border-radius:20px; padding:2.5rem; width:100%; max-width:360px; text-align:center; }
    .gate-logo { font-size:2rem; margin-bottom:.75rem; }
    .gate-box h2 { font-size:1.1rem; font-weight:900; margin-bottom:.35rem; }
    .gate-box p { font-size:.8rem; color:var(--muted); margin-bottom:1.25rem; }
    .gate-input { width:100%; padding:.7rem 1rem; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; font-size:.9rem; outline:none; margin-bottom:.65rem; text-align:center; letter-spacing:.1em; }
    .gate-input:focus { border-color:var(--green); }
    .gate-btn { width:100%; padding:.75rem; background:var(--green); color:white; border:none; border-radius:10px; font-size:.9rem; font-weight:800; cursor:pointer; font-family:inherit; }
    .gate-error { font-size:.72rem; color:#c0392b; margin-top:.5rem; display:none; }

    header { background:var(--navy); padding:0 2rem; height:58px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .header-logo { font-size:.88rem; font-weight:900; color:white; display:flex; align-items:center; gap:.55rem; text-decoration:none; }
    .header-logo span { font-size:.62rem; font-weight:500; color:rgba(255,255,255,.4); }
    .header-nav { display:flex; align-items:center; gap:1.25rem; }
    .header-nav a { font-size:.75rem; font-weight:600; color:rgba(255,255,255,.45); text-decoration:none; transition:color .15s; }
    .header-nav a:hover { color:white; }
    .header-nav a.active { color:#8ecf6a; }
    .logout-btn { font-size:.68rem; font-weight:700; color:rgba(255,255,255,.35); background:none; border:1px solid rgba(255,255,255,.12); padding:.25rem .65rem; border-radius:6px; cursor:pointer; font-family:inherit; }
    .logout-btn:hover { color:white; }

    .page { max-width:1200px; margin:0 auto; padding:2rem; }
    .toolbar {
      display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
      background:white; border:1px solid var(--border); border-radius:12px;
      padding:.85rem 1.25rem; margin-bottom:1.5rem;
    }
    .toolbar-label { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); white-space:nowrap; }
    .filter-btn { padding:.3rem .8rem; border-radius:999px; font-size:.75rem; font-weight:700; border:1.5px solid var(--border); background:white; cursor:pointer; font-family:inherit; color:var(--muted); transition:all .15s; }
    .filter-btn:hover { border-color:var(--green); color:var(--green); }
    .filter-btn.active { background:var(--green); border-color:var(--green); color:white; }
    .filter-btn.gold.active { background:var(--gold); border-color:var(--gold); color:white; }
    .toolbar-divider { width:1px; height:22px; background:var(--border); }
    .search-input {
      padding:.3rem .8rem; border:1.5px solid var(--border); border-radius:8px;
      font-family:inherit; font-size:.8rem; outline:none; width:200px;
    }
    .search-input:focus { border-color:var(--green); }
    .count-badge { margin-left:auto; font-size:.72rem; font-weight:700; color:var(--muted); white-space:nowrap; }

    /* TABLE */
    .table-wrap { background:white; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th { font-size:.6rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:.7rem 1.25rem; background:var(--cream); border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; cursor:pointer; user-select:none; }
    th:hover { color:var(--green); }
    th.sorted { color:var(--green); }
    td { font-size:.8rem; color:var(--navy); padding:.9rem 1.25rem; border-bottom:1px solid var(--border); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafcf8; }
    .td-name { font-weight:700; }
    .td-sub { font-size:.7rem; color:var(--muted); margin-top:.1rem; }
    .badge { display:inline-flex; align-items:center; font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:.22rem .6rem; border-radius:999px; cursor:pointer; transition:opacity .15s; }
    .badge:hover { opacity:.8; }
    .badge.pending   { background:#fff3e0; color:#e65100; }
    .badge.confirmed { background:var(--green-xs); color:var(--green); }
    .badge.completed { background:#e3f2fd; color:#1565c0; }
    .date-chip { display:inline-block; font-size:.62rem; font-weight:700; padding:.12rem .42rem; border-radius:999px; background:var(--green-xs); color:var(--green); border:1px solid rgba(45,90,27,.15); margin:.1rem; }
    .notes-cell { font-size:.72rem; color:var(--muted); font-style:italic; max-width:160px; }
    .route-link { font-size:.72rem; font-weight:700; color:var(--gold); text-decoration:none; white-space:nowrap; }
    .route-link:hover { text-decoration:underline; }
    .empty-state { text-align:center; padding:3rem; color:var(--muted); font-size:.875rem; }

    @media (max-width:800px) { .page { padding:1rem; } .search-input { width:140px; } }
  </style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-logo">📋</div>
    <h2>Aeration Bookings</h2>
    <p>Owner access only</p>
    <input type="password" class="gate-input" id="gate-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPass()">
    <button class="gate-btn" onclick="checkPass()">Enter</button>
    <div class="gate-error" id="gate-error">Incorrect password.</div>
  </div>
</div>

<header>
  <a href="index.html" class="header-logo">🌿 Lawngest Yard <span>Owner Portal</span></a>
  <nav class="header-nav">
    <a href="index.html">Dashboard</a>
    <a href="aeration.html" class="active">Bookings</a>
    <a href="routes.html">Route Planner</a>
    <a href="../index.html" target="_blank">Public Site ↗</a>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </nav>
</header>

<div class="page">

  <div class="toolbar">
    <span class="toolbar-label">Status</span>
    <button class="filter-btn active" data-status="all" onclick="setStatus('all',this)">All</button>
    <button class="filter-btn" data-status="pending" onclick="setStatus('pending',this)">Pending</button>
    <button class="filter-btn" data-status="confirmed" onclick="setStatus('confirmed',this)">Confirmed</button>
    <button class="filter-btn" data-status="completed" onclick="setStatus('completed',this)">Completed</button>
    <div class="toolbar-divider"></div>
    <span class="toolbar-label">Date</span>
    <div id="date-filters" style="display:flex;gap:.4rem;flex-wrap:wrap;"></div>
    <div class="toolbar-divider"></div>
    <input type="search" class="search-input" placeholder="Search name or address…" oninput="setSearch(this.value)">
    <span class="count-badge" id="count-badge">30 bookings</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('name')">Customer ↕</th>
          <th onclick="sortBy('address')">Address ↕</th>
          <th>Available Dates</th>
          <th onclick="sortBy('lawnSize')">Lawn ↕</th>
          <th>Notes</th>
          <th onclick="sortBy('status')">Status ↕</th>
          <th onclick="sortBy('created')">Received ↕</th>
          <th>Route</th>
        </tr>
      </thead>
      <tbody id="bookings-tbody"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">No bookings match your filters.</div>
  </div>

</div>

<script src="data.js"></script>
<script>
  const PASS = 'lawngest2026';
  function checkPass() {
    if (document.getElementById('gate-input').value===PASS) {
      localStorage.setItem('owner_auth','true');
      document.getElementById('gate').style.display='none'; init();
    } else { document.getElementById('gate-error').style.display='block'; document.getElementById('gate-input').value=''; }
  }
  function logout() { localStorage.removeItem('owner_auth'); location.reload(); }
  if (localStorage.getItem('owner_auth')==='true') { document.getElementById('gate').style.display='none'; }

  let filterStatus='all', filterDate='all', filterSearch='', sortCol='created', sortDir=-1;

  function fmtDate(d) { return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function fmtDateShort(d) { return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

  function getUpcomingDates(n) {
    const dates=['all']; const d=new Date();
    const daysToSat=(6-d.getDay()+7)%7||7; d.setDate(d.getDate()+daysToSat);
    for(let i=0;i<n;i++){dates.push(d.toISOString().split('T')[0]);d.setDate(d.getDate()+7);}
    return dates;
  }

  function setStatus(s,btn) {
    filterStatus=s;
    document.querySelectorAll('[data-status]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); render();
  }
  function setDateFilter(d,btn) {
    filterDate=d;
    document.querySelectorAll('[data-date]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); render();
  }
  function setSearch(v) { filterSearch=v.toLowerCase(); render(); }
  function sortBy(col) {
    if(sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; }
    render();
  }

  function cycleStatus(id) {
    const bookings=getBookings();
    const b=bookings.find(x=>x.id===id); if(!b) return;
    b.status=b.status==='pending'?'confirmed':b.status==='confirmed'?'completed':'pending';
    localStorage.setItem('aeration_bookings',JSON.stringify(bookings));
    render();
  }

  function render() {
    let bookings=getBookings();
    if(filterStatus!=='all') bookings=bookings.filter(b=>b.status===filterStatus);
    if(filterDate!=='all') bookings=bookings.filter(b=>b.dates.includes(filterDate));
    if(filterSearch) bookings=bookings.filter(b=>b.name.toLowerCase().includes(filterSearch)||b.address.toLowerCase().includes(filterSearch));
    bookings.sort((a,b)=>{
      let av=a[sortCol]||'', bv=b[sortCol]||'';
      if(Array.isArray(av)) av=av[0]||''; if(Array.isArray(bv)) bv=bv[0]||'';
      return av<bv?-sortDir:av>bv?sortDir:0;
    });
    document.getElementById('count-badge').textContent=`${bookings.length} booking${bookings.length!==1?'s':''}`;
    const tbody=document.getElementById('bookings-tbody');
    const empty=document.getElementById('empty-state');
    if(!bookings.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    tbody.innerHTML=bookings.map(b=>`
      <tr>
        <td>
          <div class="td-name">${b.name}</div>
          <div class="td-sub">📱 ${b.phone}</div>
        </td>
        <td>
          <div style="font-size:.8rem;">${b.address.split(',')[0]}</div>
          <div class="td-sub">${b.address.split(',').slice(1).join(',').trim()}</div>
        </td>
        <td>${b.dates.map(d=>`<span class="date-chip">${fmtDateShort(d)}</span>`).join('')}</td>
        <td style="text-transform:capitalize;">${b.lawnSize}</td>
        <td class="notes-cell">${b.notes||'—'}</td>
        <td><span class="badge ${b.status}" onclick="cycleStatus('${b.id}')" title="Click to cycle status">${b.status}</span></td>
        <td style="font-size:.75rem;color:var(--muted);">${b.created}</td>
        <td><a href="routes.html?date=${b.dates[0]}" class="route-link">Plan →</a></td>
      </tr>`).join('');
  }

  function init() {
    const dates=getUpcomingDates(6);
    const container=document.getElementById('date-filters');
    container.innerHTML=dates.map(d=>`
      <button class="filter-btn ${d==='all'?'active':''}" data-date="${d}" onclick="setDateFilter('${d}',this)">
        ${d==='all'?'All':fmtDate(d)}
      </button>`).join('');
    render();
  }

  if (localStorage.getItem('owner_auth')==='true') init();
</script>
</body>
</html>
