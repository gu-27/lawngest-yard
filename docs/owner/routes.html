<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Planner — Lawngest Yard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --green:#2d5a1b; --green-lt:#3d7a25; --green-xs:#edf5e8;
      --navy:#1a2535; --gold:#c9982a; --gold-xs:#fdf6e3;
      --cream:#f7f9f5; --muted:#5a6a5a; --border:#dde8d5; --white:#ffffff;
    }
    body { font-family:'Inter',sans-serif; background:var(--cream); color:var(--navy); min-height:100vh; display:flex; flex-direction:column; }

    /* GATE */
    .gate { position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .gate-box { background:white; border-radius:20px; padding:2.5rem; width:100%; max-width:360px; text-align:center; }
    .gate-logo { font-size:2rem; margin-bottom:.75rem; }
    .gate-box h2 { font-size:1.1rem; font-weight:900; margin-bottom:.35rem; }
    .gate-box p { font-size:.8rem; color:var(--muted); margin-bottom:1.25rem; }
    .gate-input { width:100%; padding:.7rem 1rem; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; font-size:.9rem; outline:none; margin-bottom:.65rem; text-align:center; letter-spacing:.1em; }
    .gate-input:focus { border-color:var(--green); }
    .gate-btn { width:100%; padding:.75rem; background:var(--green); color:white; border:none; border-radius:10px; font-size:.9rem; font-weight:800; cursor:pointer; font-family:inherit; }
    .gate-error { font-size:.72rem; color:#c0392b; margin-top:.5rem; display:none; }

    /* HEADER */
    header { background:var(--navy); padding:0 2rem; height:58px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; flex-shrink:0; }
    .header-logo { font-size:.88rem; font-weight:900; color:white; display:flex; align-items:center; gap:.55rem; text-decoration:none; }
    .header-logo span { font-size:.62rem; font-weight:500; color:rgba(255,255,255,.4); }
    .header-nav { display:flex; align-items:center; gap:1.25rem; }
    .header-nav a { font-size:.75rem; font-weight:600; color:rgba(255,255,255,.45); text-decoration:none; transition:color .15s; }
    .header-nav a:hover { color:white; }
    .header-nav a.active { color:#8ecf6a; }
    .logout-btn { font-size:.68rem; font-weight:700; color:rgba(255,255,255,.35); background:none; border:1px solid rgba(255,255,255,.12); padding:.25rem .65rem; border-radius:6px; cursor:pointer; font-family:inherit; }
    .logout-btn:hover { color:white; }

    /* CONTROLS BAR */
    .controls-bar {
      background:white; border-bottom:1px solid var(--border);
      padding:.8rem 1.5rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
      flex-shrink:0;
    }
    .ctrl-label { font-size:.63rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); white-space:nowrap; }
    .date-tab { padding:.28rem .75rem; border-radius:999px; font-size:.75rem; font-weight:700; border:1.5px solid var(--border); background:white; cursor:pointer; font-family:inherit; color:var(--muted); transition:all .15s; white-space:nowrap; }
    .date-tab:hover { border-color:var(--green); color:var(--green); }
    .date-tab.active { background:var(--green); border-color:var(--green); color:white; }
    .ctrl-divider { width:1px; height:22px; background:var(--border); }
    .cap-input { width:64px; padding:.28rem .6rem; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:.8rem; text-align:center; outline:none; }
    .cap-input:focus { border-color:var(--green); }
    .optimize-btn { padding:.35rem 1rem; background:var(--green); color:white; border:none; border-radius:8px; font-size:.78rem; font-weight:800; cursor:pointer; font-family:inherit; transition:opacity .15s; white-space:nowrap; }
    .optimize-btn:hover { opacity:.85; }
    .clear-btn { padding:.35rem .85rem; background:white; color:var(--muted); border:1.5px solid var(--border); border-radius:8px; font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
    .clear-btn:hover { border-color:var(--muted); color:var(--navy); }
    .route-summary { margin-left:auto; display:flex; align-items:center; gap:1rem; }
    .route-stat { text-align:center; }
    .route-stat-val { font-size:.95rem; font-weight:900; color:var(--navy); line-height:1; }
    .route-stat-val.green { color:var(--green); }
    .route-stat-val.gold { color:var(--gold); }
    .route-stat-lbl { font-size:.55rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:.1rem; }
    .print-btn { padding:.3rem .75rem; background:var(--gold-xs); color:var(--gold); border:1.5px solid #e8c97a; border-radius:8px; font-size:.72rem; font-weight:800; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .print-btn:hover { background:#f5ecc8; }

    /* MAIN LAYOUT */
    .main { display:flex; flex:1; overflow:hidden; height:calc(100vh - 58px - 56px); }

    /* JOB LIST */
    .job-list { width:340px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--border); background:white; }
    .job-list-hd { padding:.85rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:white; z-index:5; }
    .job-list-hd h3 { font-size:.82rem; font-weight:800; }
    .job-count { font-size:.65rem; font-weight:700; color:var(--muted); }
    .job-item { padding:.8rem 1.25rem; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; display:flex; gap:.75rem; align-items:flex-start; }
    .job-item:hover { background:var(--cream); }
    .job-item.in-route { background:#fffbf0; border-left:3px solid var(--gold); }
    .job-item.in-route:hover { background:#fef6dd; }
    .job-num { width:22px; height:22px; border-radius:50%; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:900; color:var(--muted); flex-shrink:0; margin-top:.1rem; }
    .job-num.gold { background:var(--gold); color:white; }
    .job-body { flex:1; min-width:0; }
    .job-name { font-size:.8rem; font-weight:700; }
    .job-addr { font-size:.68rem; color:var(--muted); margin-top:.1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .job-meta { display:flex; align-items:center; gap:.4rem; margin-top:.3rem; flex-wrap:wrap; }
    .size-pill { font-size:.58rem; font-weight:800; text-transform:uppercase; padding:.1rem .4rem; border-radius:999px; background:var(--green-xs); color:var(--green); }
    .badge { display:inline-flex; font-size:.58rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:.1rem .4rem; border-radius:999px; }
    .badge.pending   { background:#fff3e0; color:#e65100; }
    .badge.confirmed { background:var(--green-xs); color:var(--green); }
    .badge.completed { background:#e3f2fd; color:#1565c0; }
    .job-dist { font-size:.6rem; color:var(--gold); font-weight:700; }
    .no-jobs { padding:2rem; text-align:center; color:var(--muted); font-size:.82rem; }

    /* MAP */
    #map { flex:1; z-index:1; }

    /* HOME marker override */
    .home-icon { background:var(--navy); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid white; box-shadow:0 2px 8px rgba(0,0,0,.3); }

    @media (max-width:700px) { .job-list { width:100%; max-height:40vh; } .main { flex-direction:column; height:auto; } #map { height:50vh; min-height:300px; } }
  </style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-logo">🗺️</div>
    <h2>Route Planner</h2>
    <p>Owner access only</p>
    <input type="password" class="gate-input" id="gate-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPass()">
    <button class="gate-btn" onclick="checkPass()">Enter</button>
    <div class="gate-error" id="gate-error">Incorrect password.</div>
  </div>
</div>

<header>
  <a href="index.html" class="header-logo">🌿 Lawngest Yard <span>Owner Portal</span></a>
  <nav class="header-nav">
    <a href="index.html">Dashboard</a>
    <a href="aeration.html">Bookings</a>
    <a href="routes.html" class="active">Route Planner</a>
    <a href="../index.html" target="_blank">Public Site ↗</a>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </nav>
</header>

<div class="controls-bar" id="controls-bar">
  <span class="ctrl-label">Date</span>
  <div id="date-tabs" style="display:flex;gap:.4rem;flex-wrap:wrap;"></div>
  <div class="ctrl-divider"></div>
  <span class="ctrl-label">Capacity</span>
  <input type="number" class="cap-input" id="capacity" value="8" min="1" max="30">
  <span class="ctrl-label" style="font-size:.6rem;color:var(--muted);">jobs/day</span>
  <button class="optimize-btn" onclick="optimizeRoute()">⚡ Optimize Route</button>
  <button class="clear-btn" onclick="clearRoute()">✕ Clear</button>
  <div class="route-summary" id="route-summary" style="display:none;">
    <div class="ctrl-divider"></div>
    <div class="route-stat"><div class="route-stat-val green" id="stat-jobs">0</div><div class="route-stat-lbl">Jobs</div></div>
    <div class="route-stat"><div class="route-stat-val gold" id="stat-miles">0.0</div><div class="route-stat-lbl">Miles</div></div>
    <div class="route-stat"><div class="route-stat-val" id="stat-time">0h</div><div class="route-stat-lbl">Est. Time</div></div>
    <button class="print-btn" onclick="printRoute()">🖨 Print</button>
  </div>
</div>

<div class="main">
  <div class="job-list" id="job-list">
    <div class="job-list-hd">
      <h3 id="list-title">Available Jobs</h3>
      <span class="job-count" id="list-count">—</span>
    </div>
    <div id="job-items"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
  const PASS = 'lawngest2026';
  function checkPass() {
    if (document.getElementById('gate-input').value === PASS) {
      localStorage.setItem('owner_auth','true');
      document.getElementById('gate').style.display='none';
      initApp();
    } else {
      document.getElementById('gate-error').style.display='block';
      document.getElementById('gate-input').value='';
    }
  }
  function logout() { localStorage.removeItem('owner_auth'); location.reload(); }
  if (localStorage.getItem('owner_auth') === 'true') { document.getElementById('gate').style.display='none'; }

  // HOME base: downtown Spokane
  const HOME = { lat: 47.6588, lng: -117.4260, name: 'Home Base' };

  // State
  let map, markersLayer, routeLayer, homeMarker;
  let selectedDate = 'all';
  let routeOrder = []; // booking ids in optimized order
  let allMarkers = {}; // id -> leaflet marker

  function fmtDate(d) { return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

  function getUpcomingDates(n) {
    const dates = []; const d = new Date();
    const daysToSat = (6-d.getDay()+7)%7||7; d.setDate(d.getDate()+daysToSat);
    for(let i=0;i<n;i++){dates.push(d.toISOString().split('T')[0]);d.setDate(d.getDate()+7);}
    return dates;
  }

  // Haversine distance in miles
  function distMiles(a, b) {
    const R = 3958.8;
    const dLat = (b.lat-a.lat)*Math.PI/180;
    const dLng = (b.lng-a.lng)*Math.PI/180;
    const s = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
              Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
  }

  // Nearest-neighbor TSP
  function nearestNeighbor(jobs, capacity) {
    const pool = jobs.slice(0, capacity);
    if (!pool.length) return [];
    let current = HOME;
    const visited = [];
    const remaining = [...pool];
    while (remaining.length) {
      let best = null, bestDist = Infinity, bestIdx = -1;
      remaining.forEach((j,i) => {
        const d = distMiles(current, {lat:j.lat,lng:j.lng});
        if (d < bestDist) { bestDist=d; best=j; bestIdx=i; }
      });
      visited.push(best);
      current = {lat:best.lat, lng:best.lng};
      remaining.splice(bestIdx,1);
    }
    return visited;
  }

  function totalRouteDistance(ordered) {
    if (!ordered.length) return 0;
    let total = distMiles(HOME, {lat:ordered[0].lat,lng:ordered[0].lng});
    for(let i=1;i<ordered.length;i++) {
      total += distMiles({lat:ordered[i-1].lat,lng:ordered[i-1].lng},{lat:ordered[i].lat,lng:ordered[i].lng});
    }
    total += distMiles({lat:ordered[ordered.length-1].lat,lng:ordered[ordered.length-1].lng}, HOME);
    return total;
  }

  function getFilteredJobs() {
    const bookings = getBookings();
    if (selectedDate === 'all') return bookings;
    return bookings.filter(b => b.dates.includes(selectedDate));
  }

  // Custom numbered marker
  function makeMarker(num, inRoute, b) {
    const color = inRoute ? '#c9982a' : '#2d5a1b';
    const textColor = 'white';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:900;color:${textColor};font-family:Inter,sans-serif;">${num}</div>`,
      iconSize: [28,28], iconAnchor:[14,14], popupAnchor:[0,-16]
    });
    const marker = L.marker([b.lat, b.lng], {icon});
    marker.bindPopup(`
      <div style="font-family:Inter,sans-serif;min-width:160px;">
        <div style="font-weight:800;font-size:.85rem;margin-bottom:.2rem;">${b.name}</div>
        <div style="font-size:.72rem;color:#5a6a5a;margin-bottom:.3rem;">${b.address.split(',')[0]}</div>
        <div style="font-size:.68rem;color:#5a6a5a;">📱 ${b.phone}</div>
        <div style="font-size:.68rem;margin-top:.3rem;text-transform:capitalize;">${b.lawnSize} lawn</div>
        ${b.notes ? `<div style="font-size:.65rem;color:#5a6a5a;font-style:italic;margin-top:.25rem;">${b.notes}</div>` : ''}
      </div>`);
    return marker;
  }

  function renderMap() {
    const jobs = getFilteredJobs();
    routeOrder = [];

    // Clear existing markers & route
    markersLayer.clearLayers();
    routeLayer.clearLayers();
    allMarkers = {};

    jobs.forEach((b,i) => {
      const marker = makeMarker(i+1, false, b);
      markersLayer.addLayer(marker);
      allMarkers[b.id] = { marker, index: i };
    });
  }

  function renderJobList(ordered) {
    const jobs = getFilteredJobs();
    const routeIds = new Set(ordered.map(j=>j.id));
    const inRouteById = {};
    ordered.forEach((j,i) => inRouteById[j.id] = i+1);

    const container = document.getElementById('job-items');
    document.getElementById('list-count').textContent = `${jobs.length} available`;
    document.getElementById('list-title').textContent = ordered.length ? 'Optimized Route' : 'Available Jobs';

    if (!jobs.length) {
      container.innerHTML = '<div class="no-jobs">No bookings available for this date.</div>';
      return;
    }

    const display = ordered.length ? ordered.concat(jobs.filter(j=>!routeIds.has(j.id))) : jobs;
    container.innerHTML = display.map(b => {
      const routeNum = inRouteById[b.id];
      const inRoute = !!routeNum;
      const dist = routeNum && ordered[routeNum-1] ?
        (routeNum === 1 ? distMiles(HOME,{lat:b.lat,lng:b.lng}) :
         distMiles({lat:ordered[routeNum-2].lat,lng:ordered[routeNum-2].lng},{lat:b.lat,lng:b.lng})) : null;
      return `
        <div class="job-item ${inRoute?'in-route':''}" onclick="focusJob('${b.id}')">
          <div class="job-num ${inRoute?'gold':''}">${routeNum||'•'}</div>
          <div class="job-body">
            <div class="job-name">${b.name}</div>
            <div class="job-addr">${b.address.split(',')[0]}</div>
            <div class="job-meta">
              <span class="size-pill">${b.lawnSize}</span>
              <span class="badge ${b.status}">${b.status}</span>
              ${dist!==null?`<span class="job-dist">${dist.toFixed(1)} mi</span>`:''}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function focusJob(id) {
    const bookings = getBookings();
    const b = bookings.find(x=>x.id===id);
    if (!b) return;
    map.setView([b.lat, b.lng], 15);
    if (allMarkers[id]) allMarkers[id].marker.openPopup();
  }

  function optimizeRoute() {
    const jobs = getFilteredJobs();
    if (!jobs.length) { alert('No jobs available for this date.'); return; }
    const cap = parseInt(document.getElementById('capacity').value) || 8;
    const ordered = nearestNeighbor(jobs, cap);
    routeOrder = ordered;

    // Redraw markers with route numbers
    markersLayer.clearLayers();
    routeLayer.clearLayers();
    allMarkers = {};

    const routeIds = new Set(ordered.map(j=>j.id));
    const inRouteById = {};
    ordered.forEach((j,i) => inRouteById[j.id] = i+1);

    jobs.forEach((b,i) => {
      const routeNum = inRouteById[b.id];
      const inRoute = !!routeNum;
      const marker = makeMarker(routeNum||'•', inRoute, b);
      markersLayer.addLayer(marker);
      allMarkers[b.id] = { marker, index: i };
    });

    // Draw route polyline: home -> job1 -> job2 -> ... -> home
    if (ordered.length) {
      const coords = [
        [HOME.lat, HOME.lng],
        ...ordered.map(j=>[j.lat,j.lng]),
        [HOME.lat, HOME.lng]
      ];
      L.polyline(coords, {
        color: '#c9982a', weight: 3, opacity: .8,
        dashArray: '8 6'
      }).addTo(routeLayer);

      // Fit bounds to route
      map.fitBounds(coords, {padding:[40,40]});
    }

    // Update stats
    const miles = totalRouteDistance(ordered);
    const timeHrs = ordered.reduce((sum,j) => {
      const mins = j.lawnSize==='large'?50:j.lawnSize==='medium'?35:25;
      return sum + mins/60;
    }, 0) + miles/25; // ~25mph avg travel
    const timeStr = timeHrs >= 1 ? `${Math.floor(timeHrs)}h ${Math.round((timeHrs%1)*60)}m` : `${Math.round(timeHrs*60)}m`;

    document.getElementById('stat-jobs').textContent = ordered.length;
    document.getElementById('stat-miles').textContent = miles.toFixed(1);
    document.getElementById('stat-time').textContent = timeStr;
    document.getElementById('route-summary').style.display = 'flex';
    document.getElementById('route-summary').style.alignItems = 'center';
    document.getElementById('route-summary').style.gap = '1rem';

    renderJobList(ordered);
  }

  function clearRoute() {
    routeOrder = [];
    routeLayer.clearLayers();
    document.getElementById('route-summary').style.display = 'none';
    renderMap();
    renderJobList([]);
  }

  function setDate(d, btn) {
    selectedDate = d;
    document.querySelectorAll('.date-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    clearRoute();
  }

  function printRoute() {
    if (!routeOrder.length) { alert('Optimize a route first.'); return; }
    const dateLabel = selectedDate === 'all' ? 'All Dates' : fmtDate(selectedDate);
    const rows = routeOrder.map((j,i) => {
      const prev = i===0 ? HOME : {lat:routeOrder[i-1].lat,lng:routeOrder[i-1].lng};
      const d = distMiles(prev,{lat:j.lat,lng:j.lng}).toFixed(1);
      const mins = j.lawnSize==='large'?50:j.lawnSize==='medium'?35:25;
      return `<tr style="border-bottom:1px solid #eee;">
        <td style="padding:.5rem .75rem;font-weight:700;">${i+1}</td>
        <td style="padding:.5rem .75rem;">${j.name}</td>
        <td style="padding:.5rem .75rem;">${j.address.split(',')[0]}</td>
        <td style="padding:.5rem .75rem;text-transform:capitalize;">${j.lawnSize}</td>
        <td style="padding:.5rem .75rem;">📱 ${j.phone}</td>
        <td style="padding:.5rem .75rem;font-style:italic;color:#666;">${j.notes||'—'}</td>
        <td style="padding:.5rem .75rem;">${d} mi</td>
        <td style="padding:.5rem .75rem;">${mins} min</td>
      </tr>`;
    }).join('');
    const miles = document.getElementById('stat-miles').textContent;
    const time = document.getElementById('stat-time').textContent;
    const win = window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>Route — ${dateLabel}</title>
    <style>body{font-family:system-ui,sans-serif;padding:2rem;color:#1a2535;}h1{font-size:1.3rem;margin-bottom:.25rem;}p{font-size:.85rem;color:#666;margin-bottom:1.5rem;}table{width:100%;border-collapse:collapse;}th{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.5rem .75rem;background:#f0f4ed;text-align:left;}@media print{button{display:none;}}</style>
    </head><body>
    <button onclick="window.print()" style="margin-bottom:1rem;padding:.4rem .9rem;background:#2d5a1b;color:white;border:none;border-radius:6px;cursor:pointer;font-size:.8rem;">🖨 Print</button>
    <h1>🌿 Lawngest Yard — Route Sheet</h1>
    <p>${dateLabel} &nbsp;|&nbsp; ${routeOrder.length} jobs &nbsp;|&nbsp; ${miles} miles &nbsp;|&nbsp; Est. ${time}</p>
    <table><thead><tr><th>#</th><th>Customer</th><th>Address</th><th>Lawn</th><th>Phone</th><th>Notes</th><th>Drive</th><th>Job Time</th></tr></thead>
    <tbody>${rows}</tbody></table>
    </body></html>`);
    win.document.close();
  }

  function initApp() {
    // Build date tabs
    const upcoming = getUpcomingDates(6);
    const tabsEl = document.getElementById('date-tabs');

    // Check for ?date= param
    const urlDate = new URLSearchParams(location.search).get('date');
    if (urlDate && upcoming.includes(urlDate)) selectedDate = urlDate;

    tabsEl.innerHTML = ['all',...upcoming].map(d => {
      const isActive = d === selectedDate;
      return `<button class="date-tab ${isActive?'active':''}" onclick="setDate('${d}',this)">${d==='all'?'All Dates':fmtDate(d)}</button>`;
    }).join('');

    // Init map
    map = L.map('map').setView([HOME.lat, HOME.lng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);
    routeLayer = L.layerGroup().addTo(map);

    // Home base marker
    const homeIcon = L.divIcon({
      className: '',
      html: `<div style="width:32px;height:32px;border-radius:50%;background:#1a2535;border:2.5px solid white;box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:14px;">🏠</div>`,
      iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-18]
    });
    homeMarker = L.marker([HOME.lat, HOME.lng], {icon: homeIcon})
      .addTo(map)
      .bindPopup('<strong>Home Base</strong><div style="font-size:.75rem;color:#666;">Downtown Spokane</div>');

    renderMap();
    renderJobList([]);
  }

  if (localStorage.getItem('owner_auth') === 'true') initApp();
</script>
</body>
</html>
